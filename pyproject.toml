[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enclave-vault"
version = "0.1.0"
description = "Privacy-first AI personal data manager. Your local agent that external AIs command via MCP - they never see your documents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Enclave Contributors" }
]
keywords = [
    "ai",
    "privacy",
    "mcp",
    "llm",
    "rag",
    "encryption",
    "local-ai",
    "apple-silicon",
    "mlx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "click>=8.0.0",
    "pydantic>=2.0.0",

    # Encryption
    "cryptography>=41.0.0",

    # MCP Protocol
    "mcp>=1.0.0",

    # Database
    "sqlalchemy>=2.0.0",

    # HTTP
    "requests>=2.28.0",
    "httpx>=0.24.0",

    # Embeddings & RAG
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",

    # PDF Processing (optional but recommended)
    "pypdf>=3.0.0",
]

[project.optional-dependencies]
# Apple Silicon (MLX) support
mlx = [
    "mlx>=0.10.0",
    "mlx-lm>=0.10.0",
]

# GPU training (NVIDIA)
cuda = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "peft>=0.8.0",
    "bitsandbytes>=0.41.0",
    "datasets>=2.14.0",
]

# Desktop GUI
gui = [
    "flet>=0.21.0",
]

# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

# All optional dependencies
all = [
    "enclave-vault[mlx,gui,dev]",
]

[project.urls]
Homepage = "https://github.com/enclave-ai/enclave-vault"
Documentation = "https://github.com/enclave-ai/enclave-vault#readme"
Repository = "https://github.com/enclave-ai/enclave-vault"
Issues = "https://github.com/enclave-ai/enclave-vault/issues"

[project.scripts]
enclave = "advanced_vault.cli.main:cli"
enclave-mcp = "advanced_vault.mcp_server:main"

[project.entry-points."mcp.servers"]
enclave = "advanced_vault.mcp_server.server:create_vault_server"

[tool.hatch.build.targets.wheel]
packages = ["advanced_vault"]

[tool.hatch.build.targets.sdist]
include = [
    "/advanced_vault",
    "/docs",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests", "advanced_vault"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["advanced_vault"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.coverage.run]
source = ["advanced_vault"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
