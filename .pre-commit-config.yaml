# Pre-commit hooks for Enclave Vault
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Secret detection - prevents committing API keys, passwords, etc.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline', '--fail-on-unaudited']
        exclude: |
          (?x)^(
            .*test.*|
            .*example.*|
            .*demo.*|
            .*fixture.*
          )$

  # GitLeaks - faster Go-based secret scanner (catches more patterns)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # Python code quality — correctness rules only, matching the CI gate.
  # (Style/format rules stay advisory until the whole tree is migrated.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --select=F821,F811,F823,E9,F63,F7

  # General pre-commit checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
