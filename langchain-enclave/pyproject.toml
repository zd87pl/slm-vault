[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-enclave"
version = "0.1.0"
description = "LangChain integration for Enclave secure vault (secrets and knowledge)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Enclave Team"}
]
keywords = ["langchain", "vault", "secrets", "security", "knowledge", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "langchain>=0.0.200",
    "requests>=2.28.0",
    "pypdf>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.0.250",
]

[project.urls]
Homepage = "https://github.com/your-org/slm-vault"
Documentation = "https://github.com/your-org/slm-vault/tree/main/langchain-enclave"
Repository = "https://github.com/your-org/slm-vault"

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_enclave*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"
