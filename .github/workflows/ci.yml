name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (correctness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install "ruff>=0.15,<0.16"

      # Blocking gate: rules that indicate real bugs (undefined names,
      # syntax errors, comparison mistakes). Style rules are a local
      # concern (`ruff check advanced_vault/`) until the backlog is paid.
      - name: Ruff correctness rules
        run: ruff check advanced_vault/ --select F821,F811,F823,E9,F63,F7 --output-format=github

      - name: Ruff full report (advisory)
        run: ruff check advanced_vault/ --statistics --output-format=concise
        continue-on-error: true

  quick-test:
    name: Tests (core install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + dev deps
        run: |
          pip install -e ".[dev]"

      # Full testpaths: optional-dependency suites (GUI, MLX) skip
      # automatically via conftest guards.
      - name: Run tests
        run: |
          pytest tests/ advanced_vault/ \
            --tb=short \
            --cov=advanced_vault \
            --cov-report=xml \
            --timeout=120 \
            -p no:warnings

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # Apple Silicon is the flagship platform, so run the core suite there too.
  # The mlx extra is deliberately not installed: hosted runners are VMs with
  # no usable Metal, so MLX suites skip via their import guards, as on Linux.
  macos-test:
    name: Tests (macOS Apple Silicon)
    runs-on: macos-15  # arm64
    timeout-minutes: 30
    env:
      # These runners report MPS as available, but allocations on it fail
      # (actions/runner-images#9918, #11899), so keep embeddings on the CPU.
      ENCLAVE_EMBEDDING_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + dev deps
        run: |
          pip install -e ".[dev]"

      # Same command and flags as quick-test, minus coverage.
      - name: Run tests
        run: |
          pytest tests/ advanced_vault/ \
            --tb=short \
            --timeout=120 \
            -p no:warnings

      # The two steps below mirror the smoke job's checks on macOS.
      - name: CLI entry points respond
        run: |
          enclave --help
          enclave doctor || true  # informational; exits 1 only on hard failures
          enclave mcp config
          enclave list

      - name: README RAG example works verbatim
        run: |
          python - <<'EOF'
          from advanced_vault.training import RAGIndex
          import os

          master_key = os.urandom(32)
          with RAGIndex(master_key=master_key, db_path="./demo_rag.db") as index:
              index.add_document(
                  name="Q3 Report",
                  content="Revenue increased 15% to $4.2M in Q3..."
              )
              results = index.search("What was Q3 revenue?")
              assert results, "RAG search returned nothing"
              print(f"OK: {results[0].document_name}")
          EOF

  gui-test:
    name: GUI Tests (mock display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,gui]"

      - name: Run GUI tests
        run: |
          pytest advanced_vault/gui/tests/ -v --tb=short \
            -p no:warnings \
            --timeout=60

  smoke:
    name: Beta-user smoke test (install → CLI → MCP → RAG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exactly like a beta user (core only)
        run: pip install -e .

      - name: CLI entry points respond
        run: |
          enclave --help
          enclave doctor || true  # informational; exits 1 only on hard failures
          enclave mcp config
          enclave list

      - name: MCP server module starts
        run: |
          timeout 60 python - <<'EOF'
          import tempfile

          import advanced_vault.mcp_server as m
          from advanced_vault.mcp_server.server import create_vault_server

          assert callable(m.main)
          s = create_vault_server(tempfile.mkdtemp())
          assert s.server is not None
          print("MCP server constructs OK")
          EOF

      - name: README RAG example works verbatim
        run: |
          python - <<'EOF'
          from advanced_vault.training import RAGIndex
          import os

          master_key = os.urandom(32)
          with RAGIndex(master_key=master_key, db_path="./demo_rag.db") as index:
              index.add_document(
                  name="Q3 Report",
                  content="Revenue increased 15% to $4.2M in Q3..."
              )
              results = index.search("What was Q3 revenue?")
              assert results, "RAG search returned nothing"
              print(f"OK: {results[0].document_name}")
          EOF

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      # B413 skipped: it flags `Crypto.*` imports as the abandoned pyCrypto,
      # but this project uses pycryptodome (same namespace, maintained) with
      # a guarded fallback to `cryptography` — a well-known false positive.
      - name: Bandit security scan (full codebase)
        run: |
          bandit -r advanced_vault/ \
            -x '**/tests/**' \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r advanced_vault/ \
            -x '**/tests/**' \
            --skip B413 \
            --severity-level high \
            --confidence-level high

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
